  <style
     id="style1">
.wave { transform-box: fill-box; transform-origin: center; }
.wave1 { animation: move1 6s ease-in-out infinite; }
.wave2 { animation: move2 7.5s ease-in-out infinite; }
.wave3 { animation: move3 5.5s ease-in-out infinite; }
.wave4 { animation: move4 8.5s ease-in-out infinite; }
.wave5 { animation: move5 6.8s ease-in-out infinite; }

@keyframes move1 {
  0%, 100% { transform: translate(0px, 0px); }
  50% { transform: translate(14px, -6px); }
}
@keyframes move2 {
  0%, 100% { transform: translate(0px, 0px); }
  50% { transform: translate(-16px, 5px); }
}
@keyframes move3 {
  0%, 100% { transform: translate(0px, 0px); }
  50% { transform: translate(12px, 7px); }
}
@keyframes move4 {
  0%, 100% { transform: translate(0px, 0px); }
  50% { transform: translate(-14px, -5px); }
}
@keyframes move5 {
  0%, 100% { transform: translate(0px, 0px); }
  50% { transform: translate(10px, 6px); }
}
</style>
